name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v /testdata/ || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: no references to the old module owner
        run: |
          if grep -rInE "insurgency[g]ames" --exclude-dir=.git .; then echo "replace the old owner with arxdsilva"; exit 1; fi
      - run: go vet ./...
      # The hard gate: build, gofmt, vet, arch, `go test -race`, and coverage of
      # new code >= 70% against the base (PR target branch, or the previous
      # commit on push). New packages without tests fail.
      - name: loops gate (tests with -race + new-code coverage)
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="origin/$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            base=""
          fi
          echo "coverage base: ${base:-auto}"
          go run ./cmd/loops gate ${base:+--base "$base"}
      - name: generated platform packages are fresh
        run: go run ./cmd/loops port check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mod pane tests
        run: node --test mod/test/render.test.mjs
  release:
    # Bumps the version from conventional commits, regenerates the platform
    # packages, then pushes a "release vX.Y.Z" commit and tag. That commit's
    # subject (and tag) make the next run skip, so it cannot loop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: release
        name: release (bump, regenerate, commit, tag, push)
        run: |
          before=$(git tag --list 'v*' | sort)
          go run ./cmd/loops release --push
          after=$(git tag --list 'v*' | sort)
          new=$(printf '%s\n' "$after" | grep -vxF -f <(printf '%s\n' "$before") || true)
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "new tag: ${new:-none}"

  # Tags pushed with GITHUB_TOKEN don't trigger workflows, so the release job
  # hands its new tag to the assets workflow directly.
  assets:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
